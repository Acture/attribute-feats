name: Release

# Triggers:
#   1. Push a semver tag like v0.1.0  → auto-release
#   2. Actions → Run workflow → supply version manually
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no "v" prefix, e.g. 0.1.0)'
        required: true
        type: string

# Needs write access to create the GitHub Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Resolve version ───────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            # Strip the leading "v" from the tag name (e.g. v0.1.0 → 0.1.0)
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VER"

      # ── 3. Stamp version into metadata files ─────────────────────────────────
      - name: Patch Info.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $raw = Get-Content Info.json -Raw -Encoding UTF8
          $j   = $raw | ConvertFrom-Json
          $j.Version = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content Info.json -Encoding UTF8
          Write-Host "Info.json → Version = $v"

      - name: Patch Repository.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $raw = Get-Content Repository.json -Raw -Encoding UTF8
          $j   = $raw | ConvertFrom-Json
          $j.Releases[0].Version = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content Repository.json -Encoding UTF8
          Write-Host "Repository.json → Releases[0].Version = $v"

      # ── 4. .NET SDK ──────────────────────────────────────────────────────────
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ── 5. Download game libraries via DepotDownloader ───────────────────────
      # DepotDownloader pulls the exact game files from Steam directly.
      # No separate DLL repo to maintain — the CI always gets the current version.
      #
      # Required secrets (Settings → Secrets and variables → Actions):
      #   STEAM_USERNAME  – your Steam account username
      #   STEAM_PASSWORD  – your Steam account password
      #
      # Pathfinder: Wrath of the Righteous
      #   AppID : 1184370
      #   DepotID: 1184372  (Windows game data depot)
      #
      # Only the Managed folder is downloaded to keep the job fast.
      - name: Download DepotDownloader
        shell: pwsh
        run: |
          $url  = "https://github.com/SteamRE/DepotDownloader/releases/latest/download/DepotDownloader-windows-x64.zip"
          $dest = "$env:RUNNER_TEMP\depotdownloader.zip"
          Invoke-WebRequest -Uri $url -OutFile $dest
          Expand-Archive -Path $dest -DestinationPath "$env:RUNNER_TEMP\DepotDownloader"
          Write-Host "DepotDownloader ready"

      - name: Download game managed files from Steam
        shell: pwsh
        env:
          STEAM_USER: ${{ secrets.STEAM_USERNAME }}
          STEAM_PASS: ${{ secrets.STEAM_PASSWORD }}
        run: |
          $dd   = "$env:RUNNER_TEMP\DepotDownloader\DepotDownloader.exe"
          $dest = "${{ github.workspace }}\game-libs"
          # AppID 1184370 = Pathfinder: Wrath of the Righteous
          # DepotID 1184372 = Windows depot
          # Exclude UnityModManager sub-folder — those DLLs come from UMM releases below
          & $dd `
            -app 1184370 `
            -depot 1184372 `
            -username "$env:STEAM_USER" `
            -password "$env:STEAM_PASS" `
            -remember-password `
            -dir "$dest" `
            -regex "Wrath_Data/Managed/(?!UnityModManager).*\.dll"
          if ($LASTEXITCODE -ne 0) { throw "DepotDownloader failed" }
          Write-Host "Game files downloaded to $dest"

      # ── 5b. Download Unity Mod Manager (UMM) ─────────────────────────────────
      # UMM is NOT part of the Steam depot — players install it separately.
      # It is open-source on GitHub, so we fetch the latest release directly.
      # No secrets required.
      - name: Download Unity Mod Manager
        shell: pwsh
        run: |
          $ummDir = "${{ github.workspace }}\game-libs\Wrath_Data\Managed\UnityModManager"
          New-Item -ItemType Directory -Force -Path $ummDir | Out-Null

          # Fetch latest release metadata from GitHub API
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/newman55/unity-mod-manager/releases/latest" `
            -Headers @{ "User-Agent" = "GitHub-Actions" }

          # Find the zip asset
          $asset = $release.assets | Where-Object { $_.name -like "*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "No zip asset found in UMM release" }

          Write-Host "Downloading UMM $($release.tag_name): $($asset.browser_download_url)"
          $zipPath = "$env:RUNNER_TEMP\umm.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zipPath

          # Extract only the two DLLs we need
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          foreach ($entry in $zip.Entries) {
            if ($entry.Name -in @("UnityModManager.dll", "0Harmony.dll")) {
              $target = Join-Path $ummDir $entry.Name
              [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, $target, $true)
              Write-Host "Extracted: $($entry.Name)"
            }
          }
          $zip.Dispose()

          # Verify both files are present
          @("UnityModManager.dll", "0Harmony.dll") | ForEach-Object {
            if (-not (Test-Path (Join-Path $ummDir $_))) {
              throw "$_ not found in UMM release zip"
            }
          }
          Write-Host "UMM DLLs ready at $ummDir"

      # ── 6. Restore & Build ───────────────────────────────────────────────────
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "attribute feats.csproj" `
            /p:WrathInstallDir="${{ github.workspace }}\game-libs"

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build "attribute feats.csproj" `
            --configuration Release `
            --no-restore `
            /p:WrathInstallDir="${{ github.workspace }}\game-libs" `
            /p:Version="${{ steps.ver.outputs.version }}" `
            /p:AssemblyVersion="${{ steps.ver.outputs.version }}" `
            /p:FileVersion="${{ steps.ver.outputs.version }}"

      # ── 7. Locate the zip produced by the Deploy MSBuild target ──────────────
      - name: Find release zip
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path bin -Filter "*.zip" -Recurse |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
          if (-not $zip) { throw "No zip artifact found under bin/" }
          "path=$($zip.FullName)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($zip.Name)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Artifact: $($zip.FullName)"

      # ── 8. Publish GitHub Release ─────────────────────────────────────────────
      # On a tag push  → github.ref_name is already the semver tag (e.g. v0.1.0)
      # On manual run  → github.ref_name is a branch name, so we build the tag
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AttributeFeats v${{ steps.ver.outputs.version }}"
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}

