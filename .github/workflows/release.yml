name: Release

# Triggers:
#   1. Push a semver tag like v0.1.0  → auto-release
#   2. Actions → Run workflow → supply version manually
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (no "v" prefix, e.g. 0.1.0)'
        required: true
        type: string

# Needs write access to create the GitHub Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. Resolve version ───────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          else
            # Strip the leading "v" from the tag name (e.g. v0.1.0 → 0.1.0)
            VER="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VER"

      # ── 3. Stamp version into metadata files ─────────────────────────────────
      - name: Patch Info.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $raw = Get-Content Info.json -Raw -Encoding UTF8
          $j   = $raw | ConvertFrom-Json
          $j.Version = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content Info.json -Encoding UTF8
          Write-Host "Info.json → Version = $v"

      - name: Patch Repository.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $raw = Get-Content Repository.json -Raw -Encoding UTF8
          $j   = $raw | ConvertFrom-Json
          $j.Releases[0].Version = $v
          $j | ConvertTo-Json -Depth 10 | Set-Content Repository.json -Encoding UTF8
          Write-Host "Repository.json → Releases[0].Version = $v"

      # ── 4. .NET SDK ──────────────────────────────────────────────────────────
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ── 5. Game libraries ────────────────────────────────────────────────────
      # The project references proprietary DLLs shipped with the game.
      # Store them in a private repository and add two secrets to this repo:
      #   GAME_LIBS_REPO  – owner/repo  (e.g. "YourOrg/wotr-managed-libs")
      #   GAME_LIBS_TOKEN – a PAT with "repo" read scope for that private repo
      #
      # Expected layout inside that private repo (mirrors the game install):
      #   Wrath_Data/
      #     Managed/
      #       Assembly-CSharp.dll
      #       Assembly-CSharp-firstpass.dll
      #       Unity*.dll  |  Core*.dll  |  Owlcat*.dll
      #       Newtonsoft.Json.dll
      #       UniRx.dll               (optional)
      #       UnityModManager/
      #         UnityModManager.dll
      #         0Harmony.dll
      - name: Checkout game libraries
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GAME_LIBS_REPO }}
          token: ${{ secrets.GAME_LIBS_TOKEN }}
          path: game-libs

      # ── 6. Restore & Build ───────────────────────────────────────────────────
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore "attribute feats.csproj" `
            /p:WrathInstallDir="${{ github.workspace }}\game-libs"

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build "attribute feats.csproj" `
            --configuration Release `
            --no-restore `
            /p:WrathInstallDir="${{ github.workspace }}\game-libs" `
            /p:Version="${{ steps.ver.outputs.version }}" `
            /p:AssemblyVersion="${{ steps.ver.outputs.version }}" `
            /p:FileVersion="${{ steps.ver.outputs.version }}"

      # ── 7. Locate the zip produced by the Deploy MSBuild target ──────────────
      - name: Find release zip
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path bin -Filter "*.zip" -Recurse |
                   Sort-Object LastWriteTime -Descending |
                   Select-Object -First 1
          if (-not $zip) { throw "No zip artifact found under bin/" }
          "path=$($zip.FullName)"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($zip.Name)"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Artifact: $($zip.FullName)"

      # ── 8. Publish GitHub Release ─────────────────────────────────────────────
      # On a tag push  → github.ref_name is already the semver tag (e.g. v0.1.0)
      # On manual run  → github.ref_name is a branch name, so we build the tag
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=v${{ steps.ver.outputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "AttributeFeats v${{ steps.ver.outputs.version }}"
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.path }}
